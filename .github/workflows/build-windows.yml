name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GODOT_RELEASE: "4.6.3-stable"
  GODOT_ARCHIVE_SHA256: "e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90"
  GODOT_TEMPLATES_SHA256: "3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install fixed Godot and export templates
        shell: pwsh
        run: |
          $godotArchive = Join-Path $env:RUNNER_TEMP "godot.zip"
          $godotDirectory = Join-Path $env:RUNNER_TEMP "godot"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$env:GODOT_RELEASE/Godot_v$env:GODOT_RELEASE`_win64.exe.zip" -OutFile $godotArchive
          $godotHash = (Get-FileHash $godotArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($godotHash -ne $env:GODOT_ARCHIVE_SHA256) { throw "Godot archive checksum mismatch: $godotHash" }
          Expand-Archive -LiteralPath $godotArchive -DestinationPath $godotDirectory
          $godot = Get-ChildItem $godotDirectory -Recurse -Filter "Godot_*_win64_console.exe" | Select-Object -First 1
          if ($null -eq $godot) { throw "Godot console executable was not found" }
          "GODOT_BIN=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $templateArchive = Join-Path $env:RUNNER_TEMP "templates.tpz"
          $templateZip = Join-Path $env:RUNNER_TEMP "templates.zip"
          $templateExtract = Join-Path $env:RUNNER_TEMP "templates"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$env:GODOT_RELEASE/Godot_v$env:GODOT_RELEASE`_export_templates.tpz" -OutFile $templateArchive
          $templateHash = (Get-FileHash $templateArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($templateHash -ne $env:GODOT_TEMPLATES_SHA256) { throw "Export template checksum mismatch: $templateHash" }
          Copy-Item -LiteralPath $templateArchive -Destination $templateZip
          Expand-Archive -LiteralPath $templateZip -DestinationPath $templateExtract
          $templateSource = Get-ChildItem $templateExtract -Directory -Recurse | Where-Object Name -eq "templates" | Select-Object -First 1
          if ($null -eq $templateSource) { throw "Export template directory was not found" }
          $templateDestination = Join-Path $env:APPDATA "Godot\export_templates\4.6.3.stable"
          New-Item -ItemType Directory -Force $templateDestination | Out-Null
          Copy-Item -Path (Join-Path $templateSource.FullName "*") -Destination $templateDestination -Recurse -Force

          $angleEgl = Get-ChildItem $godotDirectory -Recurse -Filter "libEGL.dll" -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.DirectoryName "libGLESv2.dll") } | Select-Object -First 1
          $angleSource = "godot-editor"
          if ($null -eq $angleEgl) {
            $angleEgl = Get-ChildItem $templateExtract -Recurse -Filter "libEGL.x86_64.dll" -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.DirectoryName "libGLESv2.x86_64.dll") } | Select-Object -First 1
            $angleSource = "godot-template"
          }
          if ($null -eq $angleEgl) {
            $browserRoots = @(
              (Join-Path $env:ProgramFiles "Google\Chrome\Application"),
              (Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application"),
              (Join-Path $env:ProgramFiles "Microsoft\Edge\Application"),
              (Join-Path ${env:ProgramFiles(x86)} "Microsoft\Edge\Application")
            ) | Where-Object { Test-Path $_ }
            foreach ($browserRoot in $browserRoots) {
              $candidate = Get-ChildItem $browserRoot -Recurse -Filter "libEGL.dll" -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.DirectoryName "libGLESv2.dll") } | Select-Object -First 1
              if ($null -ne $candidate) {
                $angleEgl = $candidate
                $angleSource = if ($browserRoot -like "*Chrome*") { "runner-chrome" } else { "runner-edge" }
                break
              }
            }
          }

          if ($null -ne $angleEgl) {
            $glesName = if ($angleEgl.Name -eq "libEGL.x86_64.dll") { "libGLESv2.x86_64.dll" } else { "libGLESv2.dll" }
            $angleGles = Get-Item (Join-Path $angleEgl.DirectoryName $glesName)
            "ANGLE_EGL=$($angleEgl.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "ANGLE_GLES=$($angleGles.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "ANGLE_AVAILABLE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "ANGLE_SOURCE=$angleSource" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "ANGLE_AVAILABLE=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "ANGLE_SOURCE=unavailable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Export Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force builds\windows | Out-Null
          & $env:GODOT_BIN --headless --path . --export-release "Windows Desktop" builds\windows\RailCraft-Demo.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate and package Windows export
        shell: pwsh
        run: |
          $acceptanceRoot = "artifacts\acceptance"
          New-Item -ItemType Directory -Force $acceptanceRoot | Out-Null
          $environmentFile = Join-Path $acceptanceRoot "environment.txt"
          $checksumsFile = Join-Path $acceptanceRoot "checksums.txt"
          $buildLog = Join-Path $acceptanceRoot "build.log"
          $exePath = "builds\windows\RailCraft-Demo.exe"
          $zipPath = "builds\RailCraft-Demo-windows-x64.zip"

          if (-not (Test-Path $exePath)) { throw "Windows export executable is missing" }
          $exe = Get-Item $exePath
          if ($exe.Length -lt 10000000) { throw "Windows export executable is unexpectedly small: $($exe.Length)" }
          $header = [System.IO.File]::ReadAllBytes($exePath)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) { throw "Windows export does not have an MZ executable header" }

          $exeHash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Compress-Archive -Path builds\windows\* -DestinationPath $zipPath -Force
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $exportFiles = Get-ChildItem builds\windows | Sort-Object Name

          @(
            "commit=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "godot_release=$env:GODOT_RELEASE"
            "exe_size=$($exe.Length)"
            "angle_available=$env:ANGLE_AVAILABLE"
            "angle_source=$env:ANGLE_SOURCE"
          ) | Out-File -FilePath $environmentFile -Encoding utf8
          @(
            "$exeHash  RailCraft-Demo.exe"
            "$zipHash  RailCraft-Demo-windows-x64.zip"
          ) | Out-File -FilePath $checksumsFile -Encoding ascii
          @(
            "Windows export completed"
            "PE header: MZ"
            "Executable bytes: $($exe.Length)"
            "Archive: $zipPath"
            "Export files:"
          ) | Out-File -FilePath $buildLog -Encoding utf8
          $exportFiles | ForEach-Object { "$($_.Name) $($_.Length)" } | Out-File -FilePath $buildLog -Encoding utf8 -Append

      - name: Attempt exported package headless startup
        continue-on-error: true
        shell: pwsh
        run: |
          $acceptanceRoot = "artifacts\acceptance"
          $runtimeLog = Join-Path $acceptanceRoot "runtime-headless.log"
          $startupError = Join-Path $acceptanceRoot "headless-startup-error.txt"
          "headless_startup_status=started" | Out-File (Join-Path $acceptanceRoot "headless-startup-status.txt") -Encoding utf8
          try {
            $process = Start-Process -FilePath "builds\windows\RailCraft-Demo.exe" -ArgumentList @("--headless", "--quit-after", "5", "--log-file", $runtimeLog) -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              $logText = if (Test-Path $runtimeLog) { Get-Content $runtimeLog -Raw } else { "<runtime log missing>" }
              throw "Exported package headless startup failed with code $($process.ExitCode).`n$logText"
            }
            "headless_startup_status=success" | Out-File (Join-Path $acceptanceRoot "headless-startup-status.txt") -Encoding utf8
          } catch {
            $_ | Out-String | Out-File -FilePath $startupError -Encoding utf8
            throw
          }

      - name: Attempt ANGLE GUI startup
        continue-on-error: true
        shell: pwsh
        run: |
          $acceptanceRoot = "artifacts\acceptance"
          $guiLog = Join-Path $acceptanceRoot "runtime-gui.log"
          $guiError = Join-Path $acceptanceRoot "gui-startup-error.txt"
          $guiRuntime = Join-Path $env:RUNNER_TEMP "railcraft-gui-runtime"
          Remove-Item $guiRuntime -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $guiRuntime | Out-Null
          Copy-Item builds\windows\* -Destination $guiRuntime -Force
          if ($env:ANGLE_AVAILABLE -eq "true") {
            Copy-Item -LiteralPath $env:ANGLE_EGL -Destination (Join-Path $guiRuntime "libEGL.dll") -Force
            Copy-Item -LiteralPath $env:ANGLE_GLES -Destination (Join-Path $guiRuntime "libGLESv2.dll") -Force
          }
          $process = $null
          "gui_startup_status=started`nangle_available=$env:ANGLE_AVAILABLE`nangle_source=$env:ANGLE_SOURCE" | Out-File (Join-Path $acceptanceRoot "gui-startup-status.txt") -Encoding utf8
          try {
            $arguments = @("--log-file", $guiLog)
            if ($env:ANGLE_AVAILABLE -eq "true") {
              $arguments += @("--rendering-driver", "opengl3_angle")
            }
            $process = Start-Process -FilePath (Join-Path $guiRuntime "RailCraft-Demo.exe") -WorkingDirectory $guiRuntime -ArgumentList $arguments -PassThru
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              $logText = if (Test-Path $guiLog) { Get-Content $guiLog -Raw } else { "<runtime log missing>" }
              throw "GUI process exited with code $($process.ExitCode).`n$logText"
            }
            "gui_startup_status=process_alive`nmain_window_handle=$($process.MainWindowHandle)`nangle_available=$env:ANGLE_AVAILABLE`nangle_source=$env:ANGLE_SOURCE" | Out-File (Join-Path $acceptanceRoot "gui-startup-status.txt") -Encoding utf8
          } catch {
            $_ | Out-String | Out-File -FilePath $guiError -Encoding utf8
            throw
          } finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Capture ANGLE Windows start screenshot
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $acceptanceRoot = "artifacts\acceptance"
          $screenshotRoot = Join-Path $acceptanceRoot "screenshots"
          New-Item -ItemType Directory -Force $screenshotRoot | Out-Null
          $captureError = Join-Path $acceptanceRoot "capture-error.txt"
          $captureStatus = Join-Path $acceptanceRoot "capture-status.txt"
          $guiRuntime = Join-Path $env:RUNNER_TEMP "railcraft-gui-runtime-capture"
          Remove-Item $guiRuntime -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $guiRuntime | Out-Null
          Copy-Item builds\windows\* -Destination $guiRuntime -Force
          if ($env:ANGLE_AVAILABLE -eq "true") {
            Copy-Item -LiteralPath $env:ANGLE_EGL -Destination (Join-Path $guiRuntime "libEGL.dll") -Force
            Copy-Item -LiteralPath $env:ANGLE_GLES -Destination (Join-Path $guiRuntime "libGLESv2.dll") -Force
          }
          $captureProcess = $null
          "capture_status=started`nangle_available=$env:ANGLE_AVAILABLE`nangle_source=$env:ANGLE_SOURCE" | Out-File $captureStatus -Encoding utf8
          try {
            Add-Type -AssemblyName System.Drawing
            Add-Type @"
            using System;
            using System.Runtime.InteropServices;
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            public static class RailCraftWin32 {
                [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
                [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            }
            "@
            $arguments = @()
            if ($env:ANGLE_AVAILABLE -eq "true") {
              $arguments = @("--rendering-driver", "opengl3_angle")
            }
            $captureProcess = Start-Process -FilePath (Join-Path $guiRuntime "RailCraft-Demo.exe") -WorkingDirectory $guiRuntime -ArgumentList $arguments -PassThru
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              Start-Sleep -Milliseconds 250
              $captureProcess.Refresh()
              if ($captureProcess.MainWindowHandle -ne 0) { break }
            }
            if ($captureProcess.MainWindowHandle -eq 0) { throw "The hosted runner did not expose a desktop window handle" }
            [RailCraftWin32]::SetForegroundWindow($captureProcess.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 3
            $rect = New-Object RECT
            if (-not [RailCraftWin32]::GetWindowRect($captureProcess.MainWindowHandle, [ref]$rect)) {
              throw "GetWindowRect returned false"
            }
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            $bitmap = New-Object System.Drawing.Bitmap($width, $height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bitmap.Size)
            $bitmap.Save((Join-Path $screenshotRoot "01-start.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
            "capture_status=success`nwindow_width=$width`nwindow_height=$height`nangle_available=$env:ANGLE_AVAILABLE`nangle_source=$env:ANGLE_SOURCE" | Out-File $captureStatus -Encoding utf8
          } catch {
            $_ | Out-String | Out-File -FilePath $captureError -Encoding utf8
            throw
          } finally {
            if ($null -ne $captureProcess -and -not $captureProcess.HasExited) {
              Stop-Process -Id $captureProcess.Id -Force
            }
          }

      - name: Upload Windows artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RailCraft-Demo-windows-x64
          path: builds/RailCraft-Demo-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload acceptance smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RailCraft-Demo-acceptance-smoke
          path: artifacts/acceptance
          if-no-files-found: warn
          retention-days: 30

      - name: Attach tagged build to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME builds\RailCraft-Demo-windows-x64.zip --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME builds\RailCraft-Demo-windows-x64.zip --title $env:GITHUB_REF_NAME --generate-notes
          }
