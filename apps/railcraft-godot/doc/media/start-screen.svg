<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">RailCraft Demo 开始页界面布局预览</title>
  <desc id="desc">根据 ScreenCoordinator 实际布局与文案制作的矢量预览。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071523"/>
      <stop offset="1" stop-color="#102a42"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17354f"/>
      <stop offset="1" stop-color="#10283d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.22" stroke="#58b7e8" stroke-width="2" fill="none">
    <path d="M0 580 C220 500 390 640 620 555 S1030 470 1280 555"/>
    <path d="M0 620 C240 540 410 680 650 595 S1040 510 1280 595"/>
  </g>
  <g transform="translate(315 145)" filter="url(#shadow)">
    <rect width="650" height="430" rx="26" fill="url(#panel)" stroke="#2d6e96" stroke-width="2"/>
    <text x="325" y="82" text-anchor="middle" fill="#f4fbff" font-size="40" font-weight="700" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">RailCraft Demo</text>
    <text x="325" y="145" text-anchor="middle" fill="#cde6f5" font-size="20" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
      <tspan x="325" dy="0">回答 9 道铁路知识题，获得零件并按顺序完成高速动车组装配。</tspan>
      <tspan x="325" dy="36">答错可以继续尝试；答对后会显示解析和资料来源。</tspan>
    </text>
    <g transform="translate(70 240)">
      <rect width="510" height="58" rx="12" fill="#2d95cf"/>
      <text x="255" y="38" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">开始体验</text>
    </g>
    <g transform="translate(70 322)">
      <rect width="510" height="48" rx="12" fill="#173f5b" stroke="#4f7893" stroke-width="1.5"/>
      <text x="255" y="32" text-anchor="middle" fill="#dceef8" font-size="20" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">退出</text>
    </g>
  </g>
  <text x="40" y="682" fill="#80a9c2" font-size="16" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">界面布局预览 · 根据实际 ScreenCoordinator 文案与尺寸生成</text>
</svg>
